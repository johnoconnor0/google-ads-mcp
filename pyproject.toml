[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-google-ads-server"
version = "1.0.0"
description = "MCP server for Google Ads API integration"
authors = [
    {name = "John O'Connor", email = "open-source@weblifter.com.au"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp>=1.1.0",
    "google-ads>=25.0.0",
    "google-auth-oauthlib>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "PyYAML>=6.0.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
    "redis>=5.0.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "matplotlib>=3.8.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
]

[project.urls]
Homepage = "https://github.com/johnoconnor0/google-ads-mcp"
Repository = "https://github.com/johnoconnor0/google-ads-mcp"
Issues = "https://github.com/johnoconnor0/google-ads-mcp/issues"

[project.scripts]
google-ads-mcp = "google_ads_mcp:main"

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "build>=1.2.1",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
include = [
    "google_ads_mcp.py",
    "managers/**",
    "tools/**",
    "utils/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    ".git/**",
    ".github/**",
    ".venv/**",
    ".pytest_cache/**",
    "documentation/**",
    ".claude/**",
    "tests/**",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "build>=1.2.1",
]
